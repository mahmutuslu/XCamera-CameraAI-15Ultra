plugins { id 'com.android.application' }
android {
    namespace 'dev.camera18pro.v3'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.camera18pro.v3'
        minSdk 35
        targetSdk 35
        versionCode 3
        versionName '3.0.0-alpha3-api102'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*'] } }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
