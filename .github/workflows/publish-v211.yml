name: Publish CameraAI v2.11 Turkish addon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Gradle tooling
        uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.9/bin >> "$GITHUB_PATH"
      - name: Build bridge from published source
        run: gradle --no-daemon :app:assembleDebug
      - name: Build standalone Turkish addon and validate its signature
        run: |
          python -m pip install -r requirements.txt
          python tools/build_translation_apk.py \
            --bridge app/build/outputs/apk/debug/app-debug.apk \
            --output dist/CameraAI_Turkce_v2.11_Ek_Modul.apk
          sha256sum --check dist/SHA256SUMS.txt --status --ignore-missing || (cd dist && sha256sum -c SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish one-time final release (never silently re-sign it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.11-final >/dev/null 2>&1; then
            echo "::error::v2.11-final is already published. Refusing to re-sign or overwrite existing APK."
            exit 1
          fi
          gh release create v2.11-final \
            dist/CameraAI_Turkce_v2.11_Ek_Modul.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "CameraAI + XCamera — v2.11 Türkçe Final Ek Modül" \
            --notes-file RELEASE_v2.11_TR.md \
            --latest
