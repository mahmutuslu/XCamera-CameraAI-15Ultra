name: Camera18Pro v3 API102 Alpha1 APK
on:
  push:
    branches: [v3-api102-alpha1-build-20261108]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v3 debug APK
        working-directory: v3-alpha1
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify API102 module metadata
        run: |
          unzip -p v3-alpha1/app/build/outputs/apk/debug/app-debug.apk META-INF/xposed/module.prop | grep -Fx 'minApiVersion=102'
          unzip -p v3-alpha1/app/build/outputs/apk/debug/app-debug.apk META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p v3-alpha1/app/build/outputs/apk/debug/app-debug.apk META-INF/xposed/java_init.list | grep -Fx 'dev.camera18pro.v3.Pixel175Tracer'
      - uses: actions/upload-artifact@v4
        with:
          name: Camera18Pro-v3-alpha1-API102-debug
          path: v3-alpha1/app/build/outputs/apk/debug/app-debug.apk
